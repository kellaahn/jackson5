<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Punch AR Mirror</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    /* 화면 크기에 따라 전체 글자/이펙트 크기 자동 조절 (폰 ~9px, PC 16px) */
    html { font-size: clamp(9px, 2.3vmin, 16px); }
    body, html {
      width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
      overscroll-behavior: none; touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      background: #111; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    }

    /* 전체 화면 웹캠 배경 (거울 반전) */
    #webcam {
      position: fixed; inset: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1); z-index: 1;
    }

    /* 타격 시 화면 전체 붉은 플래시 */
    #flash {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(circle, rgba(255,255,255,0) 40%, rgba(255,23,68,0.45) 100%);
      opacity: 0; transition: opacity 0.08s ease-out;
    }

    /* 중앙 초대형 캐릭터 배치 */
    #stage {
      position: fixed; inset: 0; z-index: 2;
      display: flex; align-items: flex-end; justify-content: center;
      pointer-events: none;
    }
    #target-wrap {
      position: relative; height: 78vh; height: 78dvh;
      max-width: 100vw; padding-bottom: env(safe-area-inset-bottom);
      display: flex; align-items: flex-end; justify-content: center;
      transform-origin: bottom center;
      transition: transform 0.08s cubic-bezier(0.2, 1.6, 0.4, 1);
      pointer-events: auto; cursor: pointer;
    }
    #target-img {
      height: 100%; width: auto; max-width: 100%; object-fit: contain; object-position: bottom;
      filter: drop-shadow(0 16px 32px rgba(0,0,0,0.55));
    }

    /* 만화 타격 이펙트 & "퍽퍽!" 말풍선 */
    .fx-burst {
      position: fixed; z-index: 5; pointer-events: none;
      font-size: 5rem; font-weight: 900; color: #ffeb3b;
      letter-spacing: -2px;
      text-shadow:
        -4px -4px 0 #d50000,
         4px -4px 0 #d50000,
        -4px  4px 0 #d50000,
         4px  4px 0 #d50000,
         0   10px 25px rgba(0,0,0,0.7);
      animation: popOut 0.52s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
    }
    @keyframes popOut {
      0%   { transform: translate(-50%, -50%) scale(0.25) rotate(-14deg); opacity: 1; }
      45%  { transform: translate(-50%, -68%) scale(1.25) rotate(6deg);  opacity: 1; }
      100% { transform: translate(-50%, -95%) scale(0.95) rotate(0deg);  opacity: 0; }
    }

    /* 날아오는 만화 주먹 이모지 */
    .fx-fist {
      position: fixed; z-index: 4; pointer-events: none;
      font-size: 6.5rem;
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.5));
      animation: fistStrike 0.28s ease-out forwards;
    }
    @keyframes fistStrike {
      0%   { transform: translate(-50%, -50%) scale(0.4); opacity: 0.9; }
      50%  { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.0); opacity: 0; }
    }

    /* 연타 콤보 카운터 */
    #combo {
      position: fixed; top: calc(6vh + env(safe-area-inset-top)); left: 50%; z-index: 6; pointer-events: none;
      transform: translateX(-50%);
      font-size: 3rem; font-weight: 900; font-style: italic; color: #fff;
      letter-spacing: -1px; white-space: nowrap;
      text-shadow: -3px -3px 0 #ff1744, 3px -3px 0 #ff1744, -3px 3px 0 #ff1744, 3px 3px 0 #ff1744,
                   0 8px 24px rgba(0,0,0,0.6);
      opacity: 0; transition: opacity 0.25s ease;
    }
    #combo.show { opacity: 1; }
    #combo.pulse { animation: comboPulse 0.18s ease-out; }
    @keyframes comboPulse {
      0%   { transform: translateX(-50%) scale(1.6) rotate(-6deg); }
      100% { transform: translateX(-50%) scale(1) rotate(0deg); }
    }

    /* 고콤보 불꽃 파편 */
    .fx-spark {
      position: fixed; z-index: 4; pointer-events: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #ffeb3b 45%, #ff3d00 100%);
      box-shadow: 0 0 12px #ff9100;
      animation: sparkFly 0.45s ease-out forwards;
    }
    @keyframes sparkFly {
      0%   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
    }

    /* 최초 시작 버튼 (클릭 즉시 사라짐) */
    #start-overlay {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
    }
    #start-btn {
      padding: 20px 44px; font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 900;
      color: #fff; background: #ff1744; border: none; border-radius: 999px;
      box-shadow: 0 12px 32px rgba(255, 23, 68, 0.55);
      cursor: pointer; transition: transform 0.15s ease;
    }
    #start-btn:hover { transform: scale(1.06); }
    #start-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>
  <div id="flash"></div>
  <div id="combo"></div>

  <div id="stage">
    <div id="target-wrap">
      <!-- index.html과 같은 폴더에 있는 target.png 이미지를 불러옵니다 -->
      <img id="target-img" src="./target.png" alt="Target" />
    </div>
  </div>

  <div id="start-overlay">
    <button id="start-btn">👊 시작하기</button>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const flash = document.getElementById('flash');
    const targetWrap = document.getElementById('target-wrap');
    const startOverlay = document.getElementById('start-overlay');
    const startBtn = document.getElementById('start-btn');

    let audioCtx = null;
    const handState = {
      Left:  { wasFist: false, lastHit: 0, lastX: null, scaleHist: [] },
      Right: { wasFist: false, lastHit: 0, lastX: null, scaleHist: [] }
    };

    // ── 연타 콤보 ──
    const COMBO_WINDOW = 700;   // 이 시간(ms) 안에 다음 타격이 들어오면 콤보 유지
    const COMBO_MAX = 12;       // 이 콤보에서 이펙트 세기 최대치
    const comboEl = document.getElementById('combo');
    let combo = 0, lastComboHit = 0, comboTimer = null;

    function registerCombo() {
      const now = Date.now();
      combo = now - lastComboHit < COMBO_WINDOW ? combo + 1 : 1;
      lastComboHit = now;

      if (combo >= 2) {
        comboEl.textContent = `${combo} COMBO!`;
        comboEl.style.fontSize = `${3 + Math.min(combo, COMBO_MAX) * 0.25}rem`;
        comboEl.classList.add('show');
        comboEl.classList.remove('pulse');
        void comboEl.offsetWidth; // 애니메이션 재시작
        comboEl.classList.add('pulse');
      }
      clearTimeout(comboTimer);
      comboTimer = setTimeout(() => { combo = 0; comboEl.classList.remove('show'); }, COMBO_WINDOW);

      // 0(첫 타) ~ 1(최대 콤보) 세기
      return (Math.min(combo, COMBO_MAX) - 1) / (COMBO_MAX - 1);
    }

    // 묵직한 2연타 "퍽퍽!" 효과음 합성 (콤보가 쌓일수록 더 크고 낮고 겹겹이)
    function playPunchSound(p = 0) {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const master = audioCtx.createGain();
      master.gain.value = 0.7 + p * 0.5;
      master.connect(audioCtx.destination);

      const hits = p > 0.6 ? [0, 0.06, 0.12] : [0, 0.085];
      hits.forEach((offset, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = p > 0.4 ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime((idx === 0 ? 175 : 130) - p * 50, now + offset);
        osc.frequency.exponentialRampToValueAtTime(28 - p * 8, now + offset + 0.14 + p * 0.08);

        gain.gain.setValueAtTime(0.95, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.01, now + offset + 0.15 + p * 0.1);

        osc.connect(gain);
        gain.connect(master);
        osc.start(now + offset);
        osc.stop(now + offset + 0.27);
      });

      // 콤보가 붙으면 "쾅" 하는 노이즈 충격음 추가
      if (p > 0) {
        const len = 0.12 + p * 0.15;
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) ** 2;
        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 900 + p * 1800;
        const ng = audioCtx.createGain();
        ng.gain.value = 0.3 + p * 0.6;
        noise.connect(filter); filter.connect(ng); ng.connect(master);
        noise.start(now);
      }
    }

    // 화면 크기 배율 (짧은 변 700px 이상이면 1, 폰이면 ~0.5)
    function fxScale() {
      return Math.min(1, Math.min(window.innerWidth, window.innerHeight) / 700);
    }

    // 화면 전체 흔들림
    function shakeScreen(p) {
      if (p <= 0) return;
      const a = (6 + p * 22) * fxScale();
      document.body.animate([
        { transform: 'translate(0,0)' },
        { transform: `translate(${-a}px, ${a * 0.6}px)` },
        { transform: `translate(${a}px, ${-a * 0.5}px)` },
        { transform: `translate(${-a * 0.6}px, ${-a * 0.4}px)` },
        { transform: `translate(${a * 0.4}px, ${a * 0.3}px)` },
        { transform: 'translate(0,0)' }
      ], { duration: 180 + p * 120, easing: 'ease-out' });
    }

    // 불꽃 파편 튀기기
    function spawnSparks(x, y, p) {
      const n = Math.round(4 + p * 14);
      for (let i = 0; i < n; i++) {
        const s = document.createElement('div');
        s.className = 'fx-spark';
        const ang = Math.random() * Math.PI * 2;
        const r = (80 + Math.random() * (120 + p * 200)) * fxScale();
        s.style.left = `${x}%`;
        s.style.top = `${y}%`;
        s.style.setProperty('--dx', `${Math.cos(ang) * r}px`);
        s.style.setProperty('--dy', `${Math.sin(ang) * r}px`);
        const size = (8 + Math.random() * (8 + p * 14)) * Math.max(0.6, fxScale());
        s.style.width = s.style.height = `${size}px`;
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 460);
      }
    }

    // 콤보 단계별 의성어
    const WORDS = [
      ['퍽!', '빡!', '퍽퍽!'],
      ['쾅!!', '퍽퍽퍽!', '빠악!!'],
      ['콰광!!!', '파바박!!', '우당탕!!'],
      ['콰과광!!!!', '우다다다다!!', '초필살!!!']
    ];

    // 피격 모션 + 만화 말풍선/주먹 이펙트 (p: 콤보 세기 0~1)
    function triggerHit(side = 'Center') {
      const p = registerCombo();
      playPunchSound(p);
      shakeScreen(p);

      // 화면 붉은 플래시 (콤보가 높을수록 진하고 길게)
      flash.style.background =
        `radial-gradient(circle, rgba(255,255,255,${p * 0.25}) ${40 - p * 25}%, rgba(255,23,68,${0.45 + p * 0.4}) 100%)`;
      flash.style.opacity = '1';
      setTimeout(() => { flash.style.opacity = '0'; }, 90 + p * 110);

      // 캐릭터 밀려나는 모션 (콤보가 높을수록 크게)
      const dir = side === 'Left' ? 1 : side === 'Right' ? -1 : (Math.random() > 0.5 ? 1 : -1);
      const push = (52 + p * 70) * fxScale();
      const rot = 13 + p * 15;
      targetWrap.style.transform =
        `translateX(${dir * push}px) rotate(${dir * rot}deg) scale(${0.91 - p * 0.08}, ${1.06 + p * 0.08})`;
      setTimeout(() => {
        targetWrap.style.transform = 'translateX(0) rotate(0deg) scale(1, 1)';
      }, 130 + p * 60);

      const hitX = 50 + (Math.random() * 22 - 11);
      const hitY = 40 + (Math.random() * 18 - 9);

      // 주먹 충격 이모지 (커지고, 고콤보면 💥 추가)
      const fist = document.createElement('div');
      fist.className = 'fx-fist';
      const boom = p > 0.6 ? '💥💥' : '💥';
      fist.textContent = side === 'Left' ? `🤜${boom}` : side === 'Right' ? `${boom}🤛` : `👊${boom}`;
      fist.style.fontSize = `${6.5 + p * 5}rem`;
      fist.style.left = `${hitX}%`;
      fist.style.top = `${hitY + 4}%`;
      document.body.appendChild(fist);
      setTimeout(() => fist.remove(), 290);

      // 불꽃 파편 (2콤보부터)
      spawnSparks(hitX, hitY, p);

      // 만화 의성어 텍스트 (콤보 단계에 따라 단어/크기/색 강화)
      const tier = Math.min(WORDS.length - 1, Math.floor(p * WORDS.length));
      const list = WORDS[tier];
      const fx = document.createElement('div');
      fx.className = 'fx-burst';
      fx.textContent = list[Math.floor(Math.random() * list.length)];
      fx.style.fontSize = `${5 + p * 4.5}rem`;
      if (p > 0.5) fx.style.color = p > 0.85 ? '#fff' : '#ff9100';
      fx.style.left = `${hitX}%`;
      fx.style.top = `${hitY - 6}%`;
      document.body.appendChild(fx);
      setTimeout(() => fx.remove(), 530);
    }

    // 마우스 클릭 / 화면 터치로도 즉시 타격 가능
    targetWrap.addEventListener('pointerdown', () => triggerHit('Center'));

    // 3D 거리 (x는 화면 비율 보정)
    function dist(a, b) {
      const ASPECT = (video.videoWidth && video.videoHeight) ? video.videoWidth / video.videoHeight : 16 / 9;
      const dx = (a.x - b.x) * ASPECT, dy = a.y - b.y, dz = (a.z - b.z) * ASPECT;
      return Math.hypot(dx, dy, dz);
    }

    // 접힌 손가락 개수 (손 방향/회전과 무관하게 손목 기준 거리비로 판별)
    // 펴진 손가락: 손끝-손목 거리가 MCP-손목 거리의 ~1.8배 이상
    // 접힌 손가락: 손끝이 손바닥 쪽으로 말려 들어와 ~1.3배 미만
    function countFolded(lm) {
      const wrist = lm[0];
      const tips = [8, 12, 16, 20];
      const mcps = [5, 9, 13, 17];
      let folded = 0;
      for (let i = 0; i < 4; i++) {
        const ratio = dist(lm[tips[i]], wrist) / dist(lm[mcps[i]], wrist);
        if (ratio < 1.35) folded++;
      }
      return folded;
    }

    // 손 크기 (손목-중지MCP 거리) : 앞으로 뻗는 펀치 감지에 사용
    function handScale(lm) {
      return dist(lm[0], lm[9]);
    }

    const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));

    // MediaPipe Hands 설정 (양손 독립 인식)
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: IS_MOBILE ? 0 : 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // 화면 위치 기준으로 손을 추적 (MediaPipe 좌/우 라벨은 양손일 때 자주 뒤바뀌거나 겹침)
    // 영상이 좌우반전되어 있으므로 이미지 x가 큰 쪽 = 화면 왼쪽
    function assignHands(list) {
      const items = list.map(lm => ({ lm, x: lm[0].x }));
      const result = { Left: null, Right: null };
      if (items.length >= 2) {
        items.sort((a, b) => b.x - a.x);
        result.Left = items[0].lm;
        result.Right = items[1].lm;
      } else if (items.length === 1) {
        const it = items[0];
        // 직전 위치와 더 가까운 슬롯에 배정, 기록이 없으면 화면 절반 기준
        const dl = handState.Left.lastX != null ? Math.abs(handState.Left.lastX - it.x) : null;
        const dr = handState.Right.lastX != null ? Math.abs(handState.Right.lastX - it.x) : null;
        let side;
        if (dl != null && dr != null) side = dl <= dr ? 'Left' : 'Right';
        else side = it.x > 0.5 ? 'Left' : 'Right';
        result[side] = it.lm;
      }
      return result;
    }

    hands.onResults((results) => {
      const now = Date.now();
      const assigned = assignHands(results.multiHandLandmarks || []);

      ['Left', 'Right'].forEach((side) => {
        const state = handState[side];
        const lm = assigned[side];

        if (!lm) {
          // 손이 사라지면(빠른 펀치로 블러 등) 상태 초기화 → 다시 잡힐 때 주먹이면 타격
          state.wasFist = false;
          state.scaleHist = [];
          return;
        }
        state.lastX = lm[0].x;

        // 히스테리시스: 3개 이상 접히면 주먹, 1개 이하만 접히면 편 손, 그 사이는 이전 상태 유지
        const folded = countFolded(lm);
        let fist = state.wasFist;
        if (folded >= 3) fist = true;
        else if (folded <= 1) fist = false;

        // 손 크기 기록 (최근 ~200ms)
        const scale = handScale(lm);
        state.scaleHist = (state.scaleHist || []).filter(s => now - s.t < 200);
        state.scaleHist.push({ t: now, v: scale });
        const minScale = Math.min(...state.scaleHist.map(s => s.v));

        const ready = now - state.lastHit > 220;
        // ① 손을 폈다가 주먹을 쥐는 순간 타격
        const clenched = fist && !state.wasFist;
        // ② 주먹 쥔 채로 카메라 쪽으로 쭉 뻗으면(손이 급격히 커짐) 타격
        const thrust = fist && scale > minScale * 1.2;

        if (ready && (clenched || thrust)) {
          state.lastHit = now;
          state.scaleHist = [];
          triggerHit(side);
        }
        state.wasFist = fist;
      });
    });

    // 시작 버튼 클릭 시 웹캠 및 오디오 활성화
    startBtn.addEventListener('click', () => {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      startOverlay.style.display = 'none';

      const camera = new Camera(video, {
        onFrame: async () => {
          await hands.send({ image: video });
        },
        // 세로 화면이면 세로 해상도로 요청, 폰은 가볍게
        ...(() => {
          const portrait = window.innerHeight > window.innerWidth;
          const [w, h] = IS_MOBILE ? [640, 480] : [1280, 720];
          return portrait ? { width: h, height: w } : { width: w, height: h };
        })(),
        facingMode: 'user'
      });
      camera.start();
    });
  </script>
</body>
</html>
